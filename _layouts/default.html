<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>

    <div class="container">
        
        <!-- Header Section -->
        <header class="hero">
            <div class="hero-text">
                <h1>{{ page.heading }}</h1>
                <span class="eyebrow">{{ page.eyebrow }}</span>
            </div>
            {% if page.profile_pic %}
            <img src="{{ site.baseurl }}/{{ page.profile_pic }}" alt="Profile Picture" class="profile-pic">
            {% endif %}
        </header>

        <!-- Main Content Injected from Markdown -->
        <main class="content-body">
            {{ content }}
        </main>

        <!-- General Footer Section -->
        <footer class="section footer">
            <h2 class="dark-title">LET’S CONNECT</h2>
            <p>Feel free to reach out for research collaborations or just to say hi!</p>
            <div class="contact-links">
                <a href="mailto:{{ site.email }}" class="contact-link">✉️ {{ site.email }}</a>
                <a href="{{ site.linkedin_url }}" target="_blank" class="contact-link">💼 LinkedIn Profile</a>
                <a href="{{ site.lab_url }}" target="_blank" class="contact-link">🏛️ {{ site.lab_name }}</a>
            </div>
        </footer>

    </div>

</body>
</html>
